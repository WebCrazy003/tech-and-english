[package]
name = "tech-english"
version = "0.1.0"
description = "Tech news + English learning desktop app"
authors = ["poleandjerry"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "tech_english_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-notification = "2.5"
tauri-plugin-autostart = "2.6"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.6"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "json", "http2", "stream", "multipart"] }
feed-rs = "3.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
regex = "1.13"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sysinfo = "0.39"
sha2 = "0.11"
tokio-util = "0.7"
rand = "0.9"
libc = "0.2"
fsrs = "6.6"
fastrand = "2"
core-foundation = "0.10"
cpal = "0.18"
rubato = "5.0"
hound = "3.5"
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.27"
tokio = { version = "1.53", features = ["test-util", "rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
